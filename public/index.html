<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>enc.chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── JOIN ── */
  #join-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    padding: 40px;
    max-width: 480px;
  }

  #join-screen h1 {
    font-size: 16px;
    font-weight: normal;
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #join-screen label {
    display: block;
    color: #444;
    margin-bottom: 6px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #join-screen input {
    display: block;
    width: 100%;
    background: #000;
    border: none;
    border-bottom: 1px solid #222;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    padding: 8px 0;
    margin-bottom: 28px;
    outline: none;
  }

  #join-screen input:focus { border-bottom-color: #555; }

  #join-screen button {
    background: #000;
    border: 1px solid #333;
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 10px 24px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  #join-screen button:hover { border-color: #fff; color: #fff; }

  #join-error {
    color: #600;
    font-size: 11px;
    margin-top: 14px;
    letter-spacing: 1px;
    display: none;
  }

  #join-info {
    color: #222;
    font-size: 11px;
    margin-top: 44px;
    line-height: 2;
    letter-spacing: 1px;
  }

  /* ── CHAT ── */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  #chat-header {
    border-bottom: 1px solid #111;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  #header-room { color: #333; font-size: 12px; letter-spacing: 1px; }
  #header-enc  { color: #1a3a1a; font-size: 11px; letter-spacing: 1px; }

  #leave-btn {
    background: none; border: none; color: #222;
    font-family: 'Courier New', monospace;
    font-size: 11px; cursor: pointer; letter-spacing: 1px;
  }
  #leave-btn:hover { color: #888; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #messages::-webkit-scrollbar { width: 2px; }
  #messages::-webkit-scrollbar-thumb { background: #111; }

  .msg { max-width: 72%; }
  .msg.mine   { align-self: flex-end; text-align: right; }
  .msg.theirs { align-self: flex-start; }

  .msg .bubble {
    display: inline-block;
    padding: 8px 14px;
    font-size: 14px;
    word-break: break-word;
    line-height: 1.6;
    border: 1px solid #1a1a1a;
  }

  .msg.mine   .bubble { border-color: #2a2a2a; }
  .msg.theirs .bubble { border-color: #1a1a1a; color: #ccc; }

  .msg .meta {
    font-size: 10px;
    color: #2a2a2a;
    margin-top: 5px;
    letter-spacing: 1px;
  }

  /* ── INPUT ── */
  #input-area {
    border-top: 1px solid #111;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: #000;
    border: none;
    border-bottom: 1px solid #1a1a1a;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 6px 0;
    outline: none;
    resize: none;
    min-height: 28px;
    max-height: 100px;
  }
  #msg-input:focus { border-bottom-color: #333; }

  #ttl-select {
    background: #000;
    border: 1px solid #111;
    color: #333;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 4px 6px;
    outline: none;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #ttl-select:hover { border-color: #333; color: #666; }

  #send-btn {
    background: none; border: none; color: #333;
    font-family: 'Courier New', monospace;
    font-size: 12px; cursor: pointer; letter-spacing: 1px;
    white-space: nowrap; padding: 4px 0;
  }
  #send-btn:hover { color: #fff; }

  #status-bar {
    text-align: center; font-size: 10px; color: #111;
    padding: 5px; letter-spacing: 2px; flex-shrink: 0;
  }

  .sys-msg {
    text-align: center; color: #222; font-size: 11px;
    letter-spacing: 1px; align-self: center; padding: 4px 0;
  }
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen">
  <h1>enc.chat</h1>

  <label>ოთახის კოდი</label>
  <input type="text" id="room-input" placeholder="ნებისმიერი კოდი" autocomplete="off" spellcheck="false">

  <label>პაროლი</label>
  <input type="password" id="pass-input" placeholder="საიდუმლო პაროლი" autocomplete="off">

  <button onclick="joinRoom()">შესვლა</button>

  <div id="join-error"></div>

  <div id="join-info">
    — პაროლი სერვერს არ ეგზავნება<br>
    — სერვერი მხოლოდ დაშიფრულ bytes-ებს ხედავს<br>
    — IP არ ინახება, სახელი არ ინახება<br>
    — AES-256-GCM · PBKDF2 · Zero-Knowledge
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div id="chat-header">
    <span id="header-room"></span>
    <span id="header-enc">encrypted</span>
    <button id="leave-btn" onclick="leaveRoom()">გასვლა</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="msg-input" rows="1"
      placeholder="შეტყობინება..."
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"></textarea>
    <select id="ttl-select">
      <option value="60">1 წთ</option>
      <option value="300" selected>5 წთ</option>
      <option value="1800">30 წთ</option>
      <option value="3600">1 სთ</option>
    </select>
    <button id="send-btn" onclick="sendMessage()">[ გაგზავნა ]</button>
  </div>

  <div id="status-bar">zero-knowledge · aes-256-gcm · no logs · no ip</div>
</div>

<script>
"use strict";

// ══════════════════════════════════════════════════════
// CRYPTO — ყველაფერი client-ზე, სერვერი ვერაფერს ხედავს
// ══════════════════════════════════════════════════════

async function deriveKey(password, roomId) {
  const enc = new TextEncoder();
  const raw = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: enc.encode(roomId.toLowerCase().trim()),
      iterations: 100000,
      hash: "SHA-256"
    },
    raw,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptMsg(text, key) {
  const enc = new TextEncoder();
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const ct  = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
  const buf = new Uint8Array(12 + ct.byteLength);
  buf.set(iv);
  buf.set(new Uint8Array(ct), 12);
  return btoa(String.fromCharCode(...buf));
}

async function decryptMsg(b64, key) {
  try {
    const buf   = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: buf.slice(0, 12) },
      key,
      buf.slice(12)
    );
    return new TextDecoder().decode(plain);
  } catch { return null; }
}

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════

let currentKey  = null;
let currentRoom = "";
// anonymous session id — მხოლოდ RAM-ში, გვერდის დახურვისას ქრება
const SESSION_ID = crypto.randomUUID();

let pollInterval = null;
let tickInterval = null;
let renderedIds  = new Set();

// ══════════════════════════════════════════════════════
// JOIN / LEAVE
// ══════════════════════════════════════════════════════

async function joinRoom() {
  const room = document.getElementById("room-input").value.trim();
  const pass = document.getElementById("pass-input").value;
  const err  = document.getElementById("join-error");

  err.style.display = "none";

  if (!room || !pass) {
    showError("ოთახის კოდი და პაროლი საჭიროა.");
    return;
  }
  if (room.length > 128 || pass.length > 256) {
    showError("ძალიან გრძელი.");
    return;
  }

  try {
    currentKey  = await deriveKey(pass, room);
    currentRoom = room;

    document.getElementById("header-room").textContent = room;
    document.getElementById("join-screen").style.display = "none";
    document.getElementById("chat-screen").style.display = "flex";

    renderedIds.clear();
    await fetchAndRender();

    pollInterval = setInterval(fetchAndRender, 3000);
    tickInterval = setInterval(tickTimers, 1000);

  } catch (e) {
    showError("შეცდომა. სცადეთ თავიდან.");
  }
}

function leaveRoom() {
  clearInterval(pollInterval);
  clearInterval(tickInterval);
  currentKey  = null;
  currentRoom = "";
  renderedIds.clear();
  document.getElementById("messages").innerHTML = "";
  document.getElementById("chat-screen").style.display = "none";
  document.getElementById("join-screen").style.display = "flex";
  document.getElementById("pass-input").value = "";
}

function showError(msg) {
  const el = document.getElementById("join-error");
  el.textContent = msg;
  el.style.display = "block";
}

// ══════════════════════════════════════════════════════
// SEND
// ══════════════════════════════════════════════════════

async function sendMessage() {
  const input = document.getElementById("msg-input");
  const text  = input.value.trim();
  if (!text || !currentKey) return;

  const ttl = parseInt(document.getElementById("ttl-select").value);
  const enc = await encryptMsg(text, currentKey);

  try {
    const res = await fetch("/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room: currentRoom,
        enc,
        sid: SESSION_ID,
        ttl
      })
    });

    if (!res.ok) throw new Error("send failed");

    input.value = "";
    input.style.height = "auto";
    await fetchAndRender();
  } catch {
    // silent fail
  }
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

// ══════════════════════════════════════════════════════
// FETCH & RENDER
// ══════════════════════════════════════════════════════

async function fetchAndRender() {
  try {
    const res  = await fetch(`/api/messages?room=${encodeURIComponent(currentRoom)}`);
    const data = await res.json();
    await renderMessages(data.messages || []);
  } catch { /* network error — silent */ }
}

async function renderMessages(records) {
  const container = document.getElementById("messages");
  const serverIds = new Set(records.map(r => r.id));

  // Remove messages that expired on server
  document.querySelectorAll(".msg, .sys-msg").forEach(el => {
    if (el.dataset.id && !serverIds.has(el.dataset.id)) {
      el.remove();
      renderedIds.delete(el.dataset.id);
    }
  });

  let scrollNeeded = false;

  for (const rec of records) {
    if (renderedIds.has(rec.id)) continue;

    const text = await decryptMsg(rec.enc, currentKey);
    if (text === null) continue; // wrong key — skip silently

    const mine = rec.sid === SESSION_ID;

    const div = document.createElement("div");
    div.className = `msg ${mine ? "mine" : "theirs"}`;
    div.dataset.id = rec.id;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    const meta = document.createElement("div");
    meta.className = "meta";
    const secsLeft = Math.max(0, Math.floor((rec.expires - Date.now()) / 1000));
    meta.innerHTML = `<span class="timer" data-expires="${rec.expires}">${formatTime(secsLeft)}</span>`;

    div.appendChild(bubble);
    div.appendChild(meta);
    container.appendChild(div);
    renderedIds.add(rec.id);
    scrollNeeded = true;
  }

  if (scrollNeeded) container.scrollTop = container.scrollHeight;
}

// ══════════════════════════════════════════════════════
// TIMERS
// ══════════════════════════════════════════════════════

function tickTimers() {
  const now = Date.now();
  document.querySelectorAll(".timer").forEach(el => {
    const exp  = parseInt(el.dataset.expires);
    const left = Math.max(0, Math.floor((exp - now) / 1000));
    el.textContent = formatTime(left);
  });
}

function formatTime(secs) {
  if (secs <= 0) return "წაიშლება...";
  if (secs < 60) return `${secs}წმ`;
  return `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
}
</script>
</body>
</html>
