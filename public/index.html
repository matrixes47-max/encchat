<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>enc.chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── JOIN ── */
  #join-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    padding: 40px;
    max-width: 480px;
  }

  #join-screen h1 {
    font-size: 16px;
    font-weight: normal;
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #join-title {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  #join-subtitle {
    font-size: 11px;
    color: #cc0000;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  #join-screen label {
    display: block;
    color: #aaa;
    margin-bottom: 6px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #join-screen input {
    display: block;
    width: 100%;
    background: #000;
    border: none;
    border-bottom: 1px solid #555;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    padding: 8px 0;
    margin-bottom: 28px;
    outline: none;
  }

  #join-screen input:focus { border-bottom-color: #cc0000; }

  #join-screen button {
    background: #000;
    border: 1px solid #8b0000;
    color: #cc0000;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 10px 24px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  #join-screen button:hover { border-color: #ff0000; color: #ff0000; }

  #join-error {
    color: #600;
    font-size: 11px;
    margin-top: 14px;
    letter-spacing: 1px;
    display: none;
  }

  #join-info {
    color: #888;
    font-size: 12px;
    margin-top: 36px;
    line-height: 2.2;
    letter-spacing: 0.5px;
  }

  /* ── CHAT ── */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  #chat-header {
    border-bottom: 1px solid #111;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  #header-room { color: #aaa; font-size: 12px; letter-spacing: 1px; }
  #header-enc  { color: #cc0000; font-size: 11px; letter-spacing: 1px; }

  #leave-btn {
    background: none; border: none; color: #5a0000;
    font-family: 'Courier New', monospace;
    font-size: 11px; cursor: pointer; letter-spacing: 1px;
  }
  #leave-btn:hover { color: #ff0000; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #messages::-webkit-scrollbar { width: 2px; }
  #messages::-webkit-scrollbar-thumb { background: #111; }

  .msg { max-width: 72%; }
  .msg.mine   { align-self: flex-end; text-align: right; }
  .msg.theirs { align-self: flex-start; }

  .msg .bubble {
    display: inline-block;
    padding: 8px 14px;
    font-size: 14px;
    word-break: break-word;
    line-height: 1.6;
    border: 1px solid #1a1a1a;
  }

  .msg.mine   .bubble { border-color: #444; color: #fff; }
  .msg.theirs .bubble { border-color: #333; color: #ddd; }

  .msg .meta {
    font-size: 10px;
    color: #555;
    margin-top: 5px;
    letter-spacing: 1px;
  }

  /* ── INPUT ── */
  #input-area {
    border-top: 1px solid #111;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: #000;
    border: none;
    border-bottom: 1px solid #444;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 6px 0;
    outline: none;
    resize: none;
    min-height: 28px;
    max-height: 100px;
  }
  #msg-input:focus { border-bottom-color: #cc0000; }

  #ttl-select {
    background: #000;
    border: 1px solid #333;
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 4px 6px;
    outline: none;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #ttl-select:hover { border-color: #cc0000; color: #cc0000; }

  #send-btn {
    background: none; border: none; color: #cc0000;
    font-family: 'Courier New', monospace;
    font-size: 12px; cursor: pointer; letter-spacing: 1px;
    white-space: nowrap; padding: 4px 0;
  }
  #send-btn:hover { color: #ff0000; }

  #status-bar {
    text-align: center; font-size: 10px; color: #333;
    padding: 5px; letter-spacing: 2px; flex-shrink: 0;
  }

  .sys-msg {
    text-align: center; color: #222; font-size: 11px;
    letter-spacing: 1px; align-self: center; padding: 4px 0;
  }
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen">
  <div id="join-title">დაშიფრული ჩათი</div>
  <div id="join-subtitle">enc.chat — ანონიმური · Zero-Knowledge · AES-256-GCM</div>

  <label>ოთახის კოდი</label>
  <input type="text" id="room-input" placeholder="ნებისმიერი კოდი" autocomplete="off" spellcheck="false">

  <label>პაროლი</label>
  <input type="password" id="pass-input" placeholder="საიდუმლო პაროლი" autocomplete="off">

  <button onclick="joinRoom()">შესვლა</button>

  <div id="join-error"></div>

  <div id="join-info">
    — პაროლი სერვერს არ ეგზავნება<br>
    — სერვერი მხოლოდ დაშიფრულ bytes-ებს ხედავს<br>
    — IP არ ინახება, სახელი არ ინახება<br>
    — შეტყობინება თვითგანადგურდება არჩეული დროის შემდეგ
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div id="chat-header">
    <span id="header-room"></span>
    <span id="header-enc">ჩ ა თ ი</span>
    <button id="leave-btn">გასვლა</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="შეტყობინება..."></textarea>
    <select id="ttl-select">
      <option value="60">1 წთ</option>
      <option value="300" selected>5 წთ</option>
      <option value="1800">30 წთ</option>
      <option value="3600">1 სთ</option>
    </select>
    <button id="send-btn">[ გაგზავნა ]</button>
  </div>

  <div id="status-bar">zero-knowledge · aes-256-gcm · no logs · no ip</div>
</div>

<script src="/app.js"></script>
</body>
</html>
