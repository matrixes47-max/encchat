name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create missing resources
        run: |
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
          done
          echo "" | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo "" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "" | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo "" | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo "" | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.0

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encchat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
