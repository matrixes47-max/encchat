# enc.chat Nginx Reverse Proxy Configuration
# Location: /etc/nginx/sites-available/encchat

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name enc.example.com;
    
    # Allow Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enc.example.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/enc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enc.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/enc.example.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers (nginx will override app headers)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Proxy to Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Rate limiting at nginx level (optional, in addition to app-level)
        limit_req zone=api burst=10 nodelay;
    }
    
    # Health check (don't rate limit)
    location /health {
        proxy_pass http://localhost:3000;
        access_log off;
    }
    
    # Metrics (protect with auth)
    location /metrics {
        auth_basic "Metrics";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://localhost:3000;
    }
    
    # Logging — real IP არ ინახება (Zero-Knowledge policy)
    # log_format-ი http block-ში უნდა განისაზღვროს:
    # log_format anon '$time_local "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/encchat-access.log anon;
    error_log /var/log/nginx/encchat-error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}

# Rate limiting zones (define in http block of nginx.conf)
# limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
#
# ── Zero-Knowledge Logging (http block-ში დაამატე) ────────────────
# IP გამოტოვებულია — მხოლოდ დრო, მოთხოვნა, სტატუსი
# log_format anon '$time_local "$request" $status $body_bytes_sent';
#
# Installation:
# 1. Copy to /etc/nginx/sites-available/encchat
# 2. Edit domain name and SSL paths
# 3. Add log_format anon ... to /etc/nginx/nginx.conf http block
# 4. sudo ln -s /etc/nginx/sites-available/encchat /etc/nginx/sites-enabled/
# 5. sudo nginx -t
# 6. sudo systemctl reload nginx
